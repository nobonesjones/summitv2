<!DOCTYPE html>
<html>
<head>
  <title>Generate Splash Screen</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #1E1E1E;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .container {
      width: 1242px;
      height: 2436px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #1E1E1E;
    }
    .text {
      font-size: 120px;
      font-weight: bold;
      color: white;
      text-shadow: 0 4px 4px rgba(0, 0, 0, 0.25);
    }
    .instructions {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(255, 255, 255, 0.8);
      padding: 10px;
      border-radius: 5px;
      font-size: 14px;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div class="instructions">
    <p>Instructions:</p>
    <ol>
      <li>Take a screenshot of this page (the black area with "SUMMIT AI" text)</li>
      <li>Crop the image to just include the black background and text</li>
      <li>Save as splash.png in the assets/images folder</li>
      <li>Update app.json to use this new image</li>
    </ol>
  </div>
  <div class="container">
    <div class="text">SUMMIT AI</div>
  </div>
</body>
</html>
