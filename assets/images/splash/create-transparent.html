<!DOCTYPE html>
<html>
<head>
  <title>Create Transparent PNG</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    canvas {
      border: 1px solid #ccc;
    }
    button {
      margin-top: 10px;
      padding: 8px 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    .instructions {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="instructions">
    <h2>Create a Transparent PNG</h2>
    <p>This page creates a 1x1 transparent PNG. Click the button below to download it.</p>
  </div>
  
  <canvas id="canvas" width="1" height="1"></canvas>
  <br>
  <button id="download">Download Transparent PNG</button>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      
      // Create a transparent pixel
      ctx.clearRect(0, 0, 1, 1);
      
      // Set up download button
      document.getElementById('download').addEventListener('click', function() {
        const link = document.createElement('a');
        link.download = 'transparent.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    });
  </script>
</body>
</html>
